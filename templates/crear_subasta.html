{% extends "base.html" %}
{% block content %}

<main class="auth">
    <form class="form" method="POST" enctype="multipart/form-data">

        <h2>Crear nueva subasta</h2>

        <input type="text"
               name="titulo"
               placeholder="Título de la subasta"
               required>

        <input type="text"
               name="descripcion"
               placeholder="Descripción"
               required>

        <input type="text"
               name="categoria"
               placeholder="Categoría"
               required>

        <input type="number"
               step="0.01"
               name="precio_inicial"
               placeholder="Precio inicial"
               required>

        <input type="datetime-local"
               name="fecha_fin"
               required>

        <input type="file"
               name="imagen"
               accept="image/*"
               required>

        <button type="submit">
            Publicar subasta
        </button>

    </form>
</main>

{% endblock %}
